version: "3"

tasks:
  build:
    desc: Build documentation
    cmds:
      - pnpm --dir docs-site install --frozen-lockfile
      - pnpm --dir docs-site build

  build:strict:
    desc: Build documentation (CI-equivalent; astro build fails on errors)
    cmds:
      - pnpm --dir docs-site install --frozen-lockfile
      - pnpm --dir docs-site build

  serve:
    desc: Serve documentation locally with live reload
    cmds:
      - pnpm --dir docs-site install
      - pnpm --dir docs-site dev

  lint:links:
    desc: Check links with lychee
    deps:
      - build
    cmds:
      - >-
        lychee --offline --root-dir "{{.ROOT_DIR}}/docs-site/dist" --index-files index.html
        docs-site/src/content/docs README.md

  lint:prose:
    desc: Lint prose with textlint
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm exec textlint 'docs-site/src/content/docs/**/*.{md,mdx}'

  snippets:list:
    desc: List all documentation snippets discovered by alef
    cmds:
      - alef snippets list --snippets docs-site/src/snippets

  snippets:list:lang:
    desc: List snippets filtered to specific languages (LANGUAGES=rust,python)
    requires:
      vars: [LANGUAGES]
    cmds:
      - alef snippets list --snippets docs-site/src/snippets --languages {{.LANGUAGES}}

  snippets:validate:
    desc: Validate all snippet entries via alef
    cmds:
      - alef snippets check

  snippets:validate:lang:
    desc: Validate snippets for specific languages (LANGUAGES=rust,python)
    requires:
      vars: [LANGUAGES]
    cmds:
      - alef snippets check --lang {{.LANGUAGES}}

  snippets:gaps:
    desc: Report unreferenced snippets + missing language variants
    cmds:
      - alef snippets gaps --snippets docs-site/src/snippets --docs docs-site/src/content/docs

  snippets:audit:
    desc: Audit snippet structure under docs-site/src/snippets
    cmds:
      - alef snippets audit --snippets docs-site/src/snippets

  snippets:all:
    desc: Run audit + gaps + validate (canonical docs:snippets gate)
    cmds:
      - alef snippets audit --snippets docs-site/src/snippets
      - alef snippets gaps --snippets docs-site/src/snippets --docs docs-site/src/content/docs
      # --strict fails the run when a language's validator reports Unavailable (or
      # Skip/Downgraded) instead of silently passing. Without it, a language whose
      # toolchain isn't on the runner's PATH (TypeScriptValidator::is_available() etc.
      # do a global `which`, never node_modules/.bin) is dropped from the gate with no
      # signal in the exit code -- only visible by reading the printed summary line.
      #
      # `--lang` is deliberately scoped to c,csharp,dart,elixir,java,php,python,ruby,
      # rust -- the subset alef.toml's `validation_level = "compile"` can actually
      # satisfy on a runner that never builds xberg. Measured on job 33026516229
      # (2026-08-27): go 141/141 FAIL (`cannot find -lxberg_ffi` -- packages/go/.lib is
      # gitignored build output this job never populates); typescript/wasm 115
      # Unavailable + 5 FAIL (`Cannot find module '@xberg-io/xberg-wasm'` -- unbuilt
      # wasm-pack package) plus typescript/node itself passing 104/104; kotlin_android
      # 104 Unavailable (`unresolved reference 'io'` -- no Android/Gradle build here)
      # plus plain kotlin/JVM passing 98/104; swift 110/110 Unavailable (no Swift
      # toolchain installed in this job at all). zig's 110 snippets were also
      # Unavailable on that run, but because no zig toolchain was on the runner at
      # all -- that was misread as "zig needs no built artifact" and it was kept in
      # this list. A `Setup Zig` step was later added (ci-lint.yaml), and with the
      # toolchain present the real blocker surfaced: `packages/zig/build.zig` links
      # `../../target/release/libxberg_ffi.so`, which this job never builds, so all
      # 110 snippets report Unavailable regardless. zig moved out of this set for the
      # same reason go/typescript/kotlin/swift are excluded: it needs a built native
      # artifact this job does not produce. `--lang` filters by fence tag, which
      # cannot separate typescript's node session from its wasm session, or kotlin's
      # JVM session from kotlin_android -- so excluding the broken session (wasm,
      # kotlin_android) also drops its currently-passing sibling (node, kotlin/JVM)
      # from THIS gate. Those two are not re-verified anywhere else yet; that is a
      # real, currently-open coverage gap, not a design choice -- see
      # `docs-snippets gate` in ci-lint.yaml for the fuller accounting and the closure
      # plan (compile-level validation for go/typescript/kotlin/swift/zig belongs in
      # ci-e2e.yaml's per-language matrix legs, where each language's native/wasm/JVM
      # artifact is already built -- not duplicated here as a second, redundant,
      # ~1-hour FFI build).
      #
      # audit and gaps above stay unrestricted -- both are cross-language questions
      # (an unreferenced snippet or a missing language variant cannot be judged from a
      # subset) and need no build artifacts to answer. ~keep
      - >-
        alef snippets check --strict
        --lang c,csharp,dart,elixir,java,php,python,ruby,rust
