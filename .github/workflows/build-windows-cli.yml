name: Build Windows CLI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-cli:
    name: Build CLI binary (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: x86_64-pc-windows-msvc
          cache-key-prefix: cli-native-v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      - name: Build release CLI
        id: build
        uses: xberg-io/actions/build-rust-cli@v1
        with:
          package-name: xberg-cli
          binary-name: xberg
          target: x86_64-pc-windows-msvc
          extra-cargo-args: --features mcp,mcp-http,api,heic

      - name: Package release-compatible Windows CLI
        shell: bash
        env:
          BINARY_PATH: ${{ steps.build.outputs.binary-path }}
        run: |
          set -euo pipefail
          STAGE="xberg-cli-${TARGET}"
          mkdir -p "$STAGE"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          cp "$BINARY_PATH" "$STAGE/xberg.exe"

          # The official Windows CLI release dynamically links ONNX Runtime,
          # so ship the same DLL closure beside xberg.exe.
          cp "${ORT_LIB_LOCATION:?}"/*.dll "$STAGE/"
          test -f "$STAGE/onnxruntime.dll" || {
            echo "::error::onnxruntime.dll not staged"
            exit 1
          }

          # Do not let the workspace's ORT staging directory on PATH mask a
          # missing DLL in the packaged tree. This mirrors upstream publish.yaml.
          WORKSPACE_POSIX="$(pwd)"
          CLEAN_PATH=""
          while IFS= read -r path_entry; do
            test -n "$path_entry" || continue
            case "$path_entry" in
              "$WORKSPACE_POSIX" | "$WORKSPACE_POSIX"/*)
                continue
                ;;
            esac
            if test -e "$path_entry/onnxruntime.dll"; then
              echo "Dropping PATH entry providing onnxruntime.dll: $path_entry"
              continue
            fi
            CLEAN_PATH="${CLEAN_PATH:+$CLEAN_PATH:}$path_entry"
          done <<<"${PATH//:/$'\n'}"

          PATH="$CLEAN_PATH" "$STAGE/xberg.exe" --version
          echo "Windows CLI smoke test passed: $STAGE/xberg.exe --version"

          pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/ci/verify-windows-dll-closure.ps1" \
            -Artifact "$STAGE" \
            -NativeGlob "xberg.exe"

          7z a "${STAGE}.zip" "$STAGE" >/dev/null


      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: xberg-cli-x86_64-pc-windows-msvc
          path: xberg-cli-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate timestamped release version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $chinaTimeZone = [TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
          $releaseTime = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $chinaTimeZone)
          # The run number plus attempt makes the tag collision-free without an
          # API probe whose expected 404 aborts PowerShell before it can branch.
          $version = $releaseTime.ToString("yyyy.M.d-HHmm", [Globalization.CultureInfo]::InvariantCulture)
          $version = "$version-run$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $tag = "v$version"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_time=$($releaseTime.ToString("yyyy-MM-dd HH:mm zzz"))" >> $env:GITHUB_OUTPUT

      - name: Create timestamped GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TIME: ${{ steps.release.outputs.release_time }}
        run: |
          set -euo pipefail
          ASSET="xberg-cli-${TARGET}.zip"
          NOTES=$(cat <<'EOF'
          ## 这是什么

          **fork 仓库** [`jchanghong023/xberg`](https://github.com/jchanghong023/xberg) 的 Windows CLI 发布包。
          基于上游 Xberg **1.1.6**，额外修了文档抽取里 Office 矢量图 / Markdown 预览相关的问题。

          **下载后解压即可用**：`xberg.exe` + ONNX Runtime DLL。把解压目录加入 `PATH`，或直接运行 `xberg.exe`。

          ```powershell
          xberg.exe extract document.docx --content-format markdown --format text \
            --extract-images true --output-dir .\imgs \
            --config-json '{\"images\":{\"output_format\":{\"type\":\"png\"}}}'
          ```

          ## 相对上游的改动（本 fork）

          | 改动 | 说明 |
          |------|------|
          | **EMF/WMF → PNG** | Windows 下用 GDI 把 Office 里的 EMF/WMF 光栅化成 PNG，Markdown 预览器可直接显示 |
          | **图片 URL 同步** | re-encode 后重写 `content` 与 `formatted_content` 里的 `image_N.emf` → `.png`（含中文内容，UTF-8 安全） |
          | **alt 路径清洗** | 去掉 `C:\Users\...` 这类文件系统路径型 alt 文本，避免泄露本机路径 |
          | **Markdown 图文块** | 图片路径与 OCR 文字保持在同一 fenced block（便于检索与阅读） |
          | **PaddleOCR 默认** | OCR 默认后端改为 PaddleOCR（中文课件/扫描页更友好） |

          对应提交：
          - `feat(images): rasterize EMF/WMF to PNG and sanitize path-like alt text`
          - `feat(ocr,markdown): default to PaddleOCR, and keep every image's path and text in one block`
          - `fix(markdown): keep image OCR text when ocr_text_only is on`
          - `feat(markdown): keep image OCR text and its path in one position-preserving fence`

          ## 构建信息

          **Version:** ${RELEASE_VERSION}
          **Commit:** ${GITHUB_SHA}
          **Release time:** ${RELEASE_TIME}
          **Target:** ${TARGET}
          **Workflow run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## 注意

          - 与上游 [xberg-io/xberg](https://github.com/xberg-io/xberg) 无关的第三方 fork；上游更新请自行 merge。
          - 首次 OCR / layout 可能下载模型（PaddleOCR / RT-DETR），需外网。
          - 本包来自自动化流水线，未做人工全量回归；破坏性整理/清理不在本 CLI 默认路径中。
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$ASSET#Xberg Windows CLI (${TARGET})" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG (fork: EMF→PNG + Markdown 图文)" \
            --latest \
            --notes "$NOTES"
