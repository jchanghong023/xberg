name: Build Windows CLI

on:
  workflow_dispatch:

# Read-only at the workflow level: only the release job writes (tag + release), so
# the build steps -- and the third-party actions they run -- never hold a
# write-scoped token.
permissions:
  contents: read

concurrency:
  group: build-windows-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-cli:
    name: Build CLI binary (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
    outputs:
      xberg-version: ${{ steps.probe.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: x86_64-pc-windows-msvc
          cache-key-prefix: cli-native-v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      # The snapshot/transcription assets are never downloaded by the packaging
      # script itself: provision the byte-pinned set from the public sources the
      # JchTools release pipeline pinned (every file size+SHA-256 verified,
      # reused across reruns).
      - name: Provision pinned media assets
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/scripts/ci/actions/provision-media-assets.ps1"

      - name: Build and package Windows CLI
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/scripts/publish/cli/package-cli-windows.ps1" -Target x86_64-pc-windows-msvc

      # The packaging script keeps the staged tree, so probe the freshly built exe
      # instead of hardcoding an upstream version in the release body (it goes stale).
      # Two output shapes exist (verified on the staged exe): the clap `--version`
      # flag prints plain "xberg <semver>" (command name is "xberg"), while the
      # `version` SUBCOMMAND prints a styled "xberg-cli <semver>" (CARGO_PKG_NAME,
      # and the styler only honors NO_COLOR -- no isatty check, and Actions runners
      # do not set it). NO_COLOR plus the last whitespace token yields the bare
      # semver under both shapes and survives program-name or styling drift.
      - name: Probe packaged xberg version
        id: probe
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "xberg-cli-$env:TARGET/xberg.exe"
          $env:NO_COLOR = '1'
          $raw = (& $exe --version | Select-Object -First 1).Trim()
          $version = ($raw -split '\s+')[-1]
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows CLI, components and audio asset artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xberg-cli-x86_64-pc-windows-msvc
          path: |
            xberg-cli-x86_64-pc-windows-msvc.zip
            xberg-document-x86_64-pc-windows-msvc.zip
            xberg-snapshot-x86_64-pc-windows-msvc.zip
            xberg-media-x86_64-pc-windows-msvc.zip
            xberg-audio-assets-x86_64-pc-windows-msvc.zip
            xberg-components-x86_64-pc-windows-msvc.json
          if-no-files-found: error
          retention-days: 14

  release-windows-cli:
    name: Publish timestamped GitHub release
    needs: build-windows-cli
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
      XBERG_VERSION: ${{ needs.build-windows-cli.outputs.xberg-version }}
    steps:
      - name: Download Windows CLI, components and audio asset artifacts
        uses: actions/download-artifact@v8
        with:
          name: xberg-cli-x86_64-pc-windows-msvc
          path: .

      - name: Generate timestamped release version
        id: release
        shell: pwsh
        run: |
          $chinaTimeZone = [TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
          $releaseTime = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $chinaTimeZone)
          # The run number plus attempt makes the tag collision-free without an
          # API probe whose expected 404 aborts PowerShell before it can branch.
          $version = $releaseTime.ToString("yyyy.M.d-HHmm", [Globalization.CultureInfo]::InvariantCulture)
          $version = "$version-run$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $tag = "v$version"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_time=$($releaseTime.ToString("yyyy-MM-dd HH:mm zzz"))" >> $env:GITHUB_OUTPUT

      - name: Create timestamped GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TIME: ${{ steps.release.outputs.release_time }}
        run: |
          set -euo pipefail
          ASSETS=(
            "xberg-cli-${TARGET}.zip#Xberg Windows CLI full offline (${TARGET})"
            "xberg-document-${TARGET}.zip#Xberg document conversion standalone (${TARGET})"
            "xberg-snapshot-${TARGET}.zip#Xberg screenshot OCR standalone (${TARGET})"
            "xberg-media-${TARGET}.zip#Xberg audio-video transcription standalone (${TARGET})"
            "xberg-audio-assets-${TARGET}.zip#Xberg optional audio assets, not standalone (${TARGET})"
            "xberg-components-${TARGET}.json#Xberg component integrity manifest (${TARGET})"
          )
          for asset in "${ASSETS[@]}"; do
            test -f "${asset%%#*}"
          done
          STATIC_HEAD=$(cat <<'EOF'
          ## 这是什么

          **fork 仓库** [`jchanghong023/xberg`](https://github.com/jchanghong023/xberg) 的 Windows CLI 发布包。
          基于上游 Xberg **__XBERG_VERSION__**，额外修了文档抽取里 Office 矢量图 / Markdown 预览相关的问题。

          **下载后解压即可用**：`xberg.exe` + ONNX Runtime DLL。把解压目录加入 `PATH`，或直接运行 `xberg.exe`。

          ```powershell
          New-Item -ItemType Directory -Force .\imgs | Out-Null
          xberg.exe extract document.docx --content-format markdown --format text --extract-images true --output-dir .\imgs --config-json '{"images":{"output_format":{"type":"png"}}}'
          ```

          ## 按需下载组件

          同一发布同时提供完整离线包、三个可单独使用的功能包和一个非独立运行的音频资产增量包；所有归档来自同一次验证过的暂存目录，**不是按功能重编译**。
          以下文件名中的 `<target>` 为 `x86_64-pc-windows-msvc`：

          | 资产 | 内容 |
          |------|------|
          | `xberg-document-<target>.zip` | 公共运行时 + 文档 PaddleOCR HF 缓存模型 |
          | `xberg-snapshot-<target>.zip` | 公共运行时 + 独立截图 OCR 模型，不含文档模型、FFmpeg 或转写模型 / 样例 |
          | `xberg-media-<target>.zip` | 公共运行时 + SenseVoice / Silero VAD、FFmpeg 与许可、音频样例 |
          | `xberg-audio-assets-<target>.zip` | 仅 FFmpeg 与 SenseVoice / Silero VAD 资产及许可，无引擎 / 公共 DLL / 样例；不是独立运行包 |
          | `xberg-components-<target>.json` | `components` 为三个独立包，顶层 `audio_assets` 为音频增量包；各 ZIP 及成员实际大小与 SHA-256、运行时相对路径与空依赖 |
          | `xberg-cli-<target>.zip` | 保留原有全部能力的完整离线包 |

          仅截图 OCR 下载 **snapshot + 清单**，不需要 document 或 media，也没有单独的 base 下载包。
          公共运行时（`xberg.exe`、ONNX Runtime / CRT DLL、完整 `sherpa-onnx/` 及其同字节 ORT/providers 和许可、启动器与公共许可）在三个包中保持字节一致。
          JchTools 发行包内置 document + snapshot，设置页仅按需下载与内置引擎同一发布的 audio-assets，不重新下载引擎或覆盖公共 DLL。
          手动使用时将**同一发布**所需组件解压到同一目录，所有 ZIP 都保留相同 `xberg-cli-<target>/` 根目录，共享文件可安全覆盖。
          合并三个独立组件即为完整暂存运行时；audio-assets 仅向已有的同版运行时补充音频资产，不替代独立 media 包，也不是任何独立包的新依赖。

          ## 相对上游的改动（本 fork）

          | 改动 | 说明 |
          |------|------|
          | **EMF/WMF → PNG** | Windows 下用 GDI 把 Office 里的 EMF/WMF 光栅化成 PNG，Markdown 预览器可直接显示 |
          | **图片 URL 同步** | re-encode 后重写 `content` 与 `formatted_content` 里的 `image_N.emf` → `.png`（含中文内容，UTF-8 安全） |
          | **alt 路径清洗** | 去掉 `C:\Users\...` 这类文件系统路径型 alt 文本，避免泄露本机路径 |
          | **Markdown 图片独立成段** | 图片标记作为独立段落写出，便于预览器渲染；OCR 文字在后续 `text` 围栏中保留版式 |
          | **精简 OCR / 转写** | 打包版默认 OCR 为 PaddleOCR pp-ocrv6 tiny（模型随包离线可用）；Tesseract 仍编入作后备；另含截图 OCR 模型集（TextSnap PP-OCRv6 small，供 JchTools 截图 OCR 推理组件使用）；音视频离线转写由 SenseVoice INT8 + Silero VAD + FFmpeg 完成（不再附带 Whisper） |
          | **批处理图片分目录** | batch 文本/Toon 输出把各文档图片写入 `doc_<N>/`，避免同名 `image_N` 互相覆盖 |
          EOF
          )
          # The heredoc above is quoted, so __XBERG_VERSION__ was not expanded in it;
          # splice in the version probed off the built exe (build job output) instead.
          STATIC_HEAD=${STATIC_HEAD//'__XBERG_VERSION__'/${XBERG_VERSION}}
          BUILD_INFO=$(cat <<EOF
          ## 构建信息

          **Version:** ${RELEASE_VERSION}
          **Commit:** ${GITHUB_SHA}
          **Release time:** ${RELEASE_TIME}
          **Target:** ${TARGET}
          **Workflow run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          STATIC_TAIL=$(cat <<'EOF'
          ## 注意

          - 与上游 [xberg-io/xberg](https://github.com/xberg-io/xberg) 无关的第三方 fork；上游更新请自行 merge。
          - 文档 OCR 使用 document 包的 PaddleOCR pp-ocrv6 tiny 模型（约 13 MiB）；如需 Tesseract 后备请自行安装。音视频转写使用 media 包的 SenseVoice INT8 + Silero VAD 与 FFmpeg；截图 OCR 只需 snapshot 包。三个功能包均含公共运行时，无其他组件依赖；完整离线包已包含所有组件。audio-assets 只供已有同版运行时按需增加音频能力，不包含引擎或公共 DLL，不能单独运行。
          - 本包来自自动化流水线，未做人工全量回归；破坏性整理/清理不在本 CLI 默认路径中。
          EOF
          )
          NOTES="${STATIC_HEAD}"$'\n\n'"${BUILD_INFO}"$'\n\n'"${STATIC_TAIL}"

          gh release create "$RELEASE_TAG" \
            "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG (fork: EMF→PNG + Markdown 图文)" \
            --latest \
            --notes "$NOTES"
